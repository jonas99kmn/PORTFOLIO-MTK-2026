    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =================================================
           ELECTRIC BORDER
        ================================================== */

        const electricBorder =
            document.querySelector(".electric-border");

        const canvas =
            document.querySelector(".eb-canvas");

        const ctx =
            canvas.getContext("2d");


        /* CONFIGURAÇÕES */

        const electricColor = "#7df9ff";

        const speed = 1;

        const chaos = 0.12;

        const borderRadius = 16;

        const thickness = 2;

        const borderOffset = 60;

        const displacement = 60;


        let width = 0;

        let height = 0;

        let time = 0;

        let lastFrameTime = performance.now();



        /* =================================================
           RANDOM
        ================================================== */

        function random(x) {

            return (
                Math.sin(x * 12.9898) *
                43758.5453
            ) % 1;

        }



        /* =================================================
           NOISE 2D
        ================================================== */

        function noise2D(x, y) {

            const i = Math.floor(x);

            const j = Math.floor(y);

            const fx = x - i;

            const fy = y - j;


            const a =
                random(i + j * 57);

            const b =
                random(i + 1 + j * 57);

            const c =
                random(i + (j + 1) * 57);

            const d =
                random(i + 1 + (j + 1) * 57);


            const ux =
                fx * fx * (3 - 2 * fx);

            const uy =
                fy * fy * (3 - 2 * fy);


            return (

                a * (1 - ux) * (1 - uy) +

                b * ux * (1 - uy) +

                c * (1 - ux) * uy +

                d * ux * uy

            );

        }



        /* =================================================
           OCTAVED NOISE
        ================================================== */

        function octavedNoise(
            x,
            octaves,
            lacunarity,
            gain,
            amplitude,
            frequency,
            currentTime,
            seed
        ) {

            let result = 0;

            let currentAmplitude = amplitude;

            let currentFrequency = frequency;


            for (
                let i = 0;
                i < octaves;
                i++
            ) {

                result +=
                    currentAmplitude *
                    noise2D(
                        currentFrequency * x +
                        seed * 100,

                        currentTime *
                        currentFrequency *
                        0.3
                    );


                currentFrequency *=
                    lacunarity;

                currentAmplitude *=
                    gain;

            }


            return result;

        }



        /* =================================================
           CANTO
        ================================================== */

        function getCornerPoint(
            centerX,
            centerY,
            radius,
            startAngle,
            arcLength,
            progress
        ) {

            const angle =
                startAngle +
                progress * arcLength;


            return {

                x:
                    centerX +
                    radius *
                    Math.cos(angle),

                y:
                    centerY +
                    radius *
                    Math.sin(angle)

            };

        }



        /* =================================================
           RETÂNGULO ARREDONDADO
        ================================================== */

        function getRoundedRectPoint(
            t,
            left,
            top,
            rectWidth,
            rectHeight,
            radius
        ) {

            const straightWidth =
                rectWidth - 2 * radius;

            const straightHeight =
                rectHeight - 2 * radius;


            const cornerArc =
                Math.PI * radius / 2;


            const totalPerimeter =
                2 * straightWidth +
                2 * straightHeight +
                4 * cornerArc;


            const distance =
                t * totalPerimeter;


            let accumulated = 0;


            /* TOPO */

            if (
                distance <=
                accumulated + straightWidth
            ) {

                const progress =
                    (distance - accumulated) /
                    straightWidth;


                return {

                    x:
                        left +
                        radius +
                        progress *
                        straightWidth,

                    y: top

                };

            }


            accumulated += straightWidth;



            /* CANTO SUPERIOR DIREITO */

            if (
                distance <=
                accumulated + cornerArc
            ) {

                const progress =
                    (distance - accumulated) /
                    cornerArc;


                return getCornerPoint(

                    left +
                    rectWidth -
                    radius,

                    top +
                    radius,

                    radius,

                    -Math.PI / 2,

                    Math.PI / 2,

                    progress

                );

            }


            accumulated += cornerArc;



            /* DIREITA */

            if (
                distance <=
                accumulated + straightHeight
            ) {

                const progress =
                    (distance - accumulated) /
                    straightHeight;


                return {

                    x:
                        left +
                        rectWidth,

                    y:
                        top +
                        radius +
                        progress *
                        straightHeight

                };

            }


            accumulated += straightHeight;



            /* CANTO INFERIOR DIREITO */

            if (
                distance <=
                accumulated + cornerArc
            ) {

                const progress =
                    (distance - accumulated) /
                    cornerArc;


                return getCornerPoint(

                    left +
                    rectWidth -
                    radius,

                    top +
                    rectHeight -
                    radius,

                    radius,

                    0,

                    Math.PI / 2,

                    progress

                );

            }


            accumulated += cornerArc;



            /* INFERIOR */

            if (
                distance <=
                accumulated + straightWidth
            ) {

                const progress =
                    (distance - accumulated) /
                    straightWidth;


                return {

                    x:
                        left +
                        rectWidth -
                        radius -
                        progress *
                        straightWidth,

                    y:
                        top +
                        rectHeight

                };

            }


            accumulated += straightWidth;



            /* CANTO INFERIOR ESQUERDO */

            if (
                distance <=
                accumulated + cornerArc
            ) {

                const progress =
                    (distance - accumulated) /
                    cornerArc;


                return getCornerPoint(

                    left + radius,

                    top +
                    rectHeight -
                    radius,

                    radius,

                    Math.PI / 2,

                    Math.PI / 2,

                    progress

                );

            }


            accumulated += cornerArc;



            /* ESQUERDA */

            if (
                distance <=
                accumulated + straightHeight
            ) {

                const progress =
                    (distance - accumulated) /
                    straightHeight;


                return {

                    x: left,

                    y:
                        top +
                        rectHeight -
                        radius -
                        progress *
                        straightHeight

                };

            }


            accumulated += straightHeight;



            /* CANTO SUPERIOR ESQUERDO */

            const progress =
                (distance - accumulated) /
                cornerArc;


            return getCornerPoint(

                left + radius,

                top + radius,

                radius,

                Math.PI,

                Math.PI / 2,

                progress

            );

        }



        /* =================================================
           TAMANHO DO CANVAS
        ================================================== */

        function updateSize() {

            const rect =
                electricBorder.getBoundingClientRect();


            width =
                rect.width +
                borderOffset * 2;


            height =
                rect.height +
                borderOffset * 2;


            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            canvas.width =
                width * dpr;


            canvas.height =
                height * dpr;


            canvas.style.width =
                width + "px";


            canvas.style.height =
                height + "px";

        }



        /* =================================================
           DESENHO
        ================================================== */

        function drawElectricBorder(currentTime) {

            const deltaTime =
                (
                    currentTime -
                    lastFrameTime
                ) / 1000;


            time +=
                deltaTime *
                speed;


            lastFrameTime =
                currentTime;


            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );


            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            ctx.strokeStyle =
                electricColor;

            ctx.lineWidth =
                thickness;

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";


            const left =
                borderOffset;

            const top =
                borderOffset;


            const borderWidth =
                width -
                borderOffset * 2;


            const borderHeight =
                height -
                borderOffset * 2;


            const maxRadius =
                Math.min(
                    borderWidth,
                    borderHeight
                ) / 2;


            const radius =
                Math.min(
                    borderRadius,
                    maxRadius
                );


            const perimeter =
                2 *
                (
                    borderWidth +
                    borderHeight
                ) +
                2 *
                Math.PI *
                radius;


            const sampleCount =
                Math.floor(
                    perimeter / 2
                );


            ctx.beginPath();


            for (
                let i = 0;
                i <= sampleCount;
                i++
            ) {

                const progress =
                    i /
                    sampleCount;


                const point =
                    getRoundedRectPoint(
                        progress,
                        left,
                        top,
                        borderWidth,
                        borderHeight,
                        radius
                    );


                const xNoise =
                    octavedNoise(
                        progress * 8,
                        10,
                        1.6,
                        0.7,
                        chaos,
                        10,
                        time,
                        0
                    );


                const yNoise =
                    octavedNoise(
                        progress * 8,
                        10,
                        1.6,
                        0.7,
                        chaos,
                        10,
                        time,
                        1
                    );


                const x =
                    point.x +
                    xNoise *
                    displacement;


                const y =
                    point.y +
                    yNoise *
                    displacement;


                if (i === 0) {

                    ctx.moveTo(x, y);

                } else {

                    ctx.lineTo(x, y);

                }

            }


            ctx.closePath();

            ctx.stroke();


            requestAnimationFrame(
                drawElectricBorder
            );

        }



        /* =================================================
           INICIAR BORDA
        ================================================== */

        updateSize();


        window.addEventListener(
            "resize",
            updateSize
        );


        const resizeObserver =
            new ResizeObserver(
                updateSize
            );


        resizeObserver.observe(
            electricBorder
        );


        requestAnimationFrame(
            drawElectricBorder
        );



        /* =================================================
           EFEITO DE DIGITAÇÃO
        ================================================== */

        const texto =
            document.querySelector(
                ".tex_animação"
            );


        const frase =
            "Olá, meu nome é JONAS.";


        let indice = 0;


        function escreverTexto() {

            if (
                indice <
                frase.length
            ) {

                texto.textContent =
                    frase.substring(
                        0,
                        indice + 1
                    );


                indice++;


                setTimeout(
                    escreverTexto,
                    100
                );

            }

        }


        escreverTexto();

    </script>
